:root{--ink:#203c39;--green:#17675e;--soft:#e8f3ef;--line:#dce5df;--muted:#657a76;--orange:#f5b361}*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:650;min-height:44px}button:hover{background:var(--soft)}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:wait}input,select,textarea{border:1px solid #c7d6cf;border-radius:8px;padding:9px;background:white;color:var(--ink);max-width:100%}input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);vertical-align:middle}textarea{width:100%;min-height:100px;resize:vertical}header{background:#fff;border-bottom:1px solid var(--line);padding:20px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;font-size:22px;letter-spacing:.03em}.brand small{font-size:12px;color:var(--muted);display:block;font-weight:500}.mark{display:inline-grid;place-items:center;background:var(--green);color:#fff;border-radius:12px;width:42px;height:42px;margin-right:10px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 92px)}aside{padding:24px 16px;background:#fff;border-right:1px solid var(--line)}nav{display:grid;gap:8px}nav button{text-align:left;border:0;background:transparent;padding:14px}nav button.active{background:var(--soft);color:var(--green)}.navfoot{margin:30px 12px;font-size:12px;color:var(--muted)}main{max-width:1500px;width:100%;padding:28px 32px;margin:auto}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.1em}h1{font-size:28px;line-height:1.4;margin:8px 0}h2{font-size:19px;margin:0 0 16px}p{margin:8px 0 16px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.toolbar{margin:22px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.stat{padding:18px 22px;background:white;border:1px solid var(--line);border-radius:14px}.stat strong{display:block;font-size:30px}.pill{display:inline-block;background:var(--soft);color:var(--green);padding:4px 10px;border-radius:20px;font-size:12px}.pill.amber{background:#fff1db;color:#8c5e22}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted);padding:14px 12px;background:#f6f8f5}td{padding:16px 12px;border-bottom:1px solid var(--line)}td small{display:block;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.person{border-top:4px solid var(--green)}.person h2{margin-bottom:4px}.record{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.record label{font-size:13px}.record input,.record select{width:100%}.checkrow{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}.notice{background:#fff4df;padding:12px 16px;border-radius:10px;font-size:13px;margin:16px 0}.board{background:#edf4ee}.board .layout{display:block}.board aside,.board .staff-only{display:none}.board main{max-width:none}.board .grid{grid-template-columns:repeat(3,1fr)}.board .person{min-height:230px}.board .person h2{font-size:28px}.board .slot{font-size:24px;padding:14px 0}.slot{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;background:var(--ink);color:white;border-radius:12px;padding:14px 24px;max-width:90vw;box-shadow:0 6px 20px #0002}.plantext{min-height:440px;font-size:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}@media(max-width:1000px){.grid,.board .grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:180px 1fr}main{padding:22px 18px}}@media(max-width:650px){header{padding:14px 16px}.brand{font-size:18px}.layout{display:block}aside{padding:8px;border-right:0}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:10px}.navfoot{display:none}main{padding:20px 14px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:24px}.grid,.two,.board .grid{grid-template-columns:1fr}h1{font-size:24px}.card{padding:16px}.board .person h2{font-size:24px}}@media print{header,aside,.toolbar,.staff-only{display:none!important}.layout{display:block}main{padding:0}.card{break-inside:avoid}textarea{border:0}.plantext{display:none}.printtext{display:block!important;white-space:pre-wrap}}

 html,body{width:auto!important;height:auto!important;margin:0!important;background:white!important;color:black!important}

</style></head><body><header><div class="brand"><span class="mark">P</span>PiiS Road Site<small>就労継続支援B型</small></div><div class="row"><span class="pill" id="mode"></span><button id="save" class="primary staff-only" onclick="save()">変更を保存</button></div></header><div class="layout"><aside><nav id="nav"></nav><div class="navfoot">毎日の「できた」を、<br>次の支援につなげる。<hr>午前 10:00–12:00<br>午後 13:00–15:00</div></aside><main id="main"><p>読み込み中…</p></main></div><div id="toast" class="toast" hidden role="status" aria-live="polite"></div><script>
/* Shared pure logic: used by GAS and browser preview. */
const Core = (() => {
 const users=[['U01','青木 はる','はるさん','封入','PC入力','PC入力に挑戦したい'],['U02','石井 そら','そらさん','検品','封入','落ち着いて作業したい'],['U03','上田 ひかり','ひかりさん','PC入力','検品','入力作業を続けたい'],['U04','遠藤 みずき','みずきさん','封入','検品','休憩を取りながら取り組む'],['U05','大野 りく','りくさん','検品','PC入力','新しい作業も試したい'],['U06','加藤 あお','あおさん','PC入力','封入','午前の作業を安定させたい']].map(a=>Object.fromEntries(['id','name','display','skill','practice','wish'].map((k,i)=>[k,a[i]])));
 const legacyJobs=[{id:'J01',name:'封入',capacity:3,rate:220},{id:'J02',name:'検品',capacity:2,rate:250},{id:'J03',name:'PC入力',capacity:2,rate:300}];
 const jobs=[['J101','コーヒー豆焙煎作業',220],['J102','清掃',250],['J103','梱包',300],['J104','施設外就労',250],['J105','その他',220]].map(([id,name,rate])=>({id,name,capacity:6,rate,active:true}));
 const conditions=['安定している','疲れやすい','痛みや不調あり','不安が強い'];
 const responses=['通常の声かけ','手順確認が必要','相談の促しが必要','作業量の調整が必要'];
 function normalize(s){const map={'封入':'梱包','検品':'清掃','PC入力':'コーヒー豆焙煎作業'};s.users.forEach(u=>{u.skill=map[u.skill]||u.skill;u.practice=map[u.practice]||u.practice});s.jobs.forEach(j=>{if(legacyJobs.some(o=>o.id===j.id&&o.name===j.name))j.active=false;else if(j.active===undefined||j.active==='')j.active=true;});for(const j of jobs)if(!s.jobs.some(x=>x.id===j.id))s.jobs.push({...j});for(const d of Object.values(s.days))for(const r of d.rows){r.attendance=r.attendance||(r.present?'出席':'欠席');r.condition=r.condition||'';r.response=r.response||'';for(const k of ['am','pm']){r[k+'Start']=r[k+'Start']||'';r[k+'End']=r[k+'End']||'';r[k+'Break']=Number(r[k+'Break']||0);}}return s;}
 function minutes(start,end,rest=0){if(!start&&!end)return 0;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(end))throw Error('開始・終了時刻を両方入力してください');const n=t=>Number(t.slice(0,2))*60+Number(t.slice(3));const span=n(end)-n(start);if(span<=0)throw Error('終了時刻は開始時刻より後にしてください（日をまたぐ作業は非対応）');if(!Number.isInteger(rest)||rest<0||rest>span)throw Error('休憩分は作業時間の範囲内で入力してください');return span-rest;}
 function attended(r){return r.attendance?r.attendance!=='欠席':r.present;}
 function seed(){return normalize({version:0,users:JSON.parse(JSON.stringify(users)),jobs:JSON.parse(JSON.stringify(jobs)),days:{},plans:{}});}
 function blank(s){return {published:false,rows:s.users.map(u=>({uid:u.id,present:true,am:'',pm:'',amActual:'',pmActual:'',amMin:0,pmMin:0,amRate:0,pmRate:0,done:false,meal:false,pickup:false,dropoff:false,note:'',reason:'',attendance:'出席',condition:'',response:'',amStart:'',amEnd:'',pmStart:'',pmEnd:'',amBreak:0,pmBreak:0}))};}
 function suggest(s,d,practice){let day=JSON.parse(JSON.stringify(d));day.published=false; const counts={am:{},pm:{}}; for(const r of day.rows){if(!r.present){r.am=r.pm='';continue;} const u=s.users.find(x=>x.id===r.uid);for(const slot of ['am','pm']){let preferred=practice&&slot==='pm'?u.practice:u.skill; let opts=s.jobs.filter(j=>j.active!==false).filter(j=>(counts[slot][j.id]||0)<j.capacity).sort((a,b)=>(b.name===preferred)-(a.name===preferred));let j=opts[0];r[slot]=j?j.id:'';if(j)counts[slot][j.id]=(counts[slot][j.id]||0)+1;}r.reason=practice?'午前は得意作業、午後は練習希望と定員を考慮':'得意作業と定員を考慮';}return day;}
 function money(r){return r.done&&attended(r)?Math.round((r.amMin*r.amRate+r.pmMin*r.pmRate)/60):0;}
 function validate(s){if(!s||!Array.isArray(s.users)||!Array.isArray(s.jobs)||!s.days||!s.plans)throw Error('データ形式が不正です');for(const [date,d] of Object.entries(s.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('日付を確認してください');if(d.rows.length!==s.users.length||new Set(d.rows.map(r=>r.uid)).size!==s.users.length)throw Error('利用者の重複・不足があります');const c={am:{},pm:{}};for(const r of d.rows){if(!s.users.some(u=>u.id===r.uid))throw Error('利用者が見つかりません');if(!['出席','欠席','遅刻','早退','遅刻・早退'].includes(r.attendance|| (r.present?'出席':'欠席')))throw Error('出欠区分が不正です');for(const [key,opts] of [['condition',conditions],['response',responses]])if(String(r[key]||'').split('／').filter(Boolean).some(v=>!opts.includes(v)))throw Error('本人の様子・対処の項目が不正です');for(const slot of ['am','pm']){if(r[slot+'Start']||r[slot+'End'])r[slot+'Min']=minutes(r[slot+'Start'],r[slot+'End'],Number(r[slot+'Break']||0));for(const k of [slot,slot+'Actual'])if(r[k]&&!s.jobs.some(j=>j.id===r[k]))throw Error('作業が見つかりません');if(!Number.isFinite(r[slot+'Min'])||r[slot+'Min']<0||r[slot+'Min']>1440)throw Error('作業分数を確認してください');if(!Number.isFinite(r[slot+'Rate'])||r[slot+'Rate']<0)throw Error('単価が不正です');if(r.done&&attended(r)&&r[slot+'Min']>0&&!r[slot+'Actual'])throw Error('実際の作業を選択してください');if(r.present&&r[slot])c[slot][r[slot]]=(c[slot][r[slot]]||0)+1;if(d.published&&r.present&&!r[slot])throw Error('通所予定者の午前・午後の作業を選んでください');}if(r.amEnd&&r.pmStart&&r.amEnd>r.pmStart)throw Error('午前と午後の作業時間が重複しています');if(!attended(r)&&(r.amMin||r.pmMin||r.meal||r.pickup||r.dropoff))throw Error('欠席者の作業時間・食事・送迎を解除してください');if(String(r.note).length>5000)throw Error('メモは5000文字以内です');}if(d.published)for(const slot of ['am','pm'])for(const j of s.jobs)if((c[slot][j.id]||0)>j.capacity)throw Error(j.name+'が定員を超えています');}return true;}
 function draft(s,uid,start,end,interview){const u=s.users.find(x=>x.id===uid);const records=Object.entries(s.days).filter(([date])=>date>=start&&date<=end).flatMap(([date,d])=>d.rows.filter(r=>r.uid===uid&&r.done).map(r=>({date,r})));let lines=records.map(({date,r})=>`${date}：${r.attendance||'出席'}・${r.amMin+r.pmMin}分／様子：${r.condition||'未入力'}／対処：${r.response||'未入力'}／${r.note||'支援メモ未入力'}`);return `個別支援計画 原案（職員による確認・編集前）\n対象：${u.name}\n参照期間：${start}〜${end}\n\n【本人の希望：登録情報】\n${u.wish}\n\n【期間内の確定記録】\n${lines.join('\n')||'記録なし。評価は未記入。'}\n\n【面談記録：入力内容】\n${interview||'未入力'}\n\n【目標・支援内容】\n職員が本人の希望と上記の記録を確認して記入してください。\n目標：\n支援内容：\n担当者：\n見直し時期：\n\n【職員協議・本人との確認】\n未実施`;
 }
 return {seed,blank,suggest,money,validate,draft,normalize,minutes,attended,conditions,responses};
})();
if(typeof module!=='undefined')module.exports=Core;

let s, page='schedule',dirty=false,busy=false;const gas=typeof google!=='undefined'&&google.script&&google.script.run;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const localKey='piis-road-site-public-demo-v1';let date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());let uid='U01',month=date.slice(0,7);const tabs=[['schedule','01　予定をつくる'],['board','02　電子ホワイトボード'],['records','03　実績を記録'],['summary','04　月次・工賃'],['plan','05　支援計画']];
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,5500)}function change(){dirty=true;$('save').textContent='変更を保存 ●';}
function d(){return s.days[date]||(s.days[date]=Core.blank(s));}function user(id){return s.users.find(u=>u.id===id)}function job(id){return s.jobs.find(j=>j.id===id)}function name(id){return job(id)?.name||'未割り当て'}function opt(id){return '<option value="">未割り当て</option>'+s.jobs.filter(j=>j.active!==false||j.id===id).map(j=>`<option value="${esc(j.id)}" ${id===j.id?'selected':''}>${esc(j.name)}</option>`).join('')}
function render(){document.body.classList.toggle('board',page==='board');$('nav').innerHTML=tabs.map(([id,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');$('mode').textContent=gas?'Google Sheets 接続':'端末内に保存するデモ';$('main').innerHTML=({schedule:scheduled,board:board,records:records,summary:summary,plan:plan})[page]();}
function go(p){page=p;render()}function dates(){return `<label>表示日 <input aria-label="表示日" type="date" value="${date}" onchange="setDate(this.value)"></label>`;}function setDate(v){if(!v)return;date=v;render()}
function scheduled(){const day=d(),n=day.rows.filter(r=>r.present).length;return `<div class="eyebrow">DAILY PLANNING</div><h1>今日の予定を確認</h1><p class="muted">通所予定を確認して、作業の仮案をつくりましょう。</p><div class="toolbar">${dates()}<button onclick="tomorrow()">翌日へ</button><span class="pill ${day.published?'':'amber'}">${day.published?'掲示中':'下書き'}</span></div><div class="stats"><div class="stat">通所予定<strong>${n}<small> 名</small></strong></div><div class="stat">作業の種類<strong>${s.jobs.filter(j=>j.active!==false).length}<small> 種</small></strong></div><div class="stat">実績記録済み<strong>${day.rows.filter(r=>r.done&&Core.attended(r)).length}<small> 名</small></strong></div></div><div class="card"><div class="row between"><h2>作業の割り振り</h2><div class="row"><button onclick="suggest(false)">得意作業で仮案</button><button onclick="suggest(true)">午後に練習を入れる</button><button class="primary" onclick="publish()">予定を確定・掲示</button></div></div><p class="muted">仮案は通所予定・得意作業・定員を使うルール方式です。本人の希望や当日の体調は職員が確認します。</p><div class="table-wrap"><table><thead><tr><th>通所</th><th>利用者</th><th>午前 10:00–12:00</th><th>午後 13:00–15:00</th><th>本人の希望</th></tr></thead><tbody>${day.rows.map((r,i)=>`<tr><td><input aria-label="${esc(user(r.uid).name)}の通所" type="checkbox" ${r.present?'checked':''} onchange="attendance(${i},this.checked)"></td><td><b>${esc(user(r.uid).name)}</b><small>得意：${esc(user(r.uid).skill)}</small></td><td><select aria-label="午前の作業" ${!r.present?'disabled':''} onchange="assign(${i},'am',this.value)">${opt(r.am)}</select></td><td><select aria-label="午後の作業" ${!r.present?'disabled':''} onchange="assign(${i},'pm',this.value)">${opt(r.pm)}</select></td><td>${esc(user(r.uid).wish)}</td></tr>`).join('')}</tbody></table></div></div><p class="muted">${s.jobs.filter(j=>j.active!==false).map(j=>`${esc(j.name)}：各枠${j.capacity}名まで`).join('　／　')}</p>`;}
function tomorrow(){const dt=new Date(date+'T12:00:00+09:00');dt.setUTCDate(dt.getUTCDate()+1);date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(dt);render()}
function attendance(i,v){const r=d().rows[i];if(!v&&r.done){toast('先に実績の「記録済み」を解除してください');render();return;}r.present=v;if(!v){r.am=r.pm='';r.meal=r.pickup=r.dropoff=false;}d().published=false;change();render()}
function assign(i,k,v){d().rows[i][k]=v;d().published=false;change()}
function suggest(practice){if(d().rows.some(r=>r.am||r.pm)&&!confirm('この日の予定の割り振りを作り直しますか？実績は保持します。'))return;s.days[date]=Core.suggest(s,d(),practice);change();render();toast('仮案を作成しました。内容を確認して確定してください。')}
async function publish(){const prev=d().published;d().published=true;try{Core.validate(s);change();if(await save())go('board');else{d().published=prev;render();}}catch(e){d().published=prev;toast(e.message)}}
function board(){const day=d();return `<div class="row between"><div><div class="eyebrow">TODAY'S BOARD</div><h1>${esc(date)}　今日の作業</h1></div><div class="row"><button onclick="go('schedule')">職員画面へ</button><button onclick="document.documentElement.requestFullscreen?.().catch(()=>toast('全画面表示に対応していません'))">全画面表示</button></div></div><div class="toolbar">${dates()}<span class="pill">${day.published?'確定した予定':'予定の確定待ち'}</span></div>${!day.published?'<div class="card"><h2>予定を準備しています</h2><p>職員画面で予定を確定すると表示されます。</p></div>':`<div class="grid">${day.rows.filter(r=>r.present).map(r=>`<article class="card person"><h2>${esc(user(r.uid).display)}</h2><div class="slot"><span>10:00–12:00</span><b>${esc(name(r.am))}</b></div><div class="slot"><span>13:00–15:00</span><b>${esc(name(r.pm))}</b></div></article>`).join('')}</div><div class="card row between"><h2 style="margin:0">12:00–13:00　お昼休み</h2><span>困ったときは、職員に声をかけてください。</span></div>`}<p class="muted">掲示モードは支援メモ・面談・工賃を表示しません。同じ端末の職員用画面に戻れるため、操作できない位置で掲示してください。</p>`;}
function checks(i,r,key,options){return `<fieldset style="border:1px solid var(--line);border-radius:8px;margin:12px 0"><legend>${key==='condition'?'本人の様子':'対処'}（複数選択可）</legend>${options.map(v=>`<label style="display:block;margin:5px 0"><input type="checkbox" ${(r[key]||'').split('／').includes(v)?'checked':''} onchange="toggleItem(${i},'${key}','${v}',this.checked)"> ${v}</label>`).join('')}</fieldset>`;}
function records(){return `<div class="eyebrow">DAILY RECORD</div><h1>今日の実績記録</h1><p class="muted">予定は残したまま、当日の出欠・実作業・本人の様子を記録します。</p><div class="toolbar">${dates()}</div><div class="grid">${d().rows.map((r,i)=>`<article class="card"><div class="row between"><h2>${esc(user(r.uid).name)}</h2><span class="pill" id="status-${i}">${r.done?'記録済み':'未記録'}</span></div><label>出欠区分<select style="display:block;width:100%" onchange="setAttendance(${i},this.value)">${['出席','欠席','遅刻','早退','遅刻・早退'].map(v=>`<option ${r.attendance===v?'selected':''}>${v}</option>`).join('')}</select></label>${Core.attended(r)?`<button style="margin-top:12px" onclick="asPlanned(${i})">予定どおりの作業を反映</button>${['am','pm'].map(k=>`<div style="margin-top:14px"><label>${k==='am'?'午前':'午後'}の実際の作業<select style="width:100%" onchange="actual(${i},'${k}',this.value)">${opt(r[k+'Actual'])}</select></label><div class="record"><label>開始時刻<input type="time" value="${esc(r[k+'Start'])}" oninput="timeField(${i},'${k}','Start',this.value)"></label><label>終了時刻<input type="time" value="${esc(r[k+'End'])}" oninput="timeField(${i},'${k}','End',this.value)"></label><label>休憩（分）<input type="number" min="0" value="${r[k+'Break']||0}" oninput="timeField(${i},'${k}','Break',Number(this.value))"></label><div>実作業（自動）<br><strong id="mins-${i}-${k}">${r[k+'Min']}</strong> 分</div></div><small id="time-error-${i}-${k}" style="color:#a23d2b">${!r[k+'Start']&&r[k+'Min']?'旧記録：分数を保持しています。時刻は未登録です。':''}</small></div>`).join('')}<div class="checkrow">${[['meal','昼食'],['pickup','迎え'],['dropoff','送り']].map(([k,n])=>`<label><input type="checkbox" ${r[k]?'checked':''} oninput="field(${i},'${k}',this.checked)"> ${n}</label>`).join('')}</div>`:'<p class="muted">欠席の記録を残せます。作業時間と工賃は0になります。</p>'}${checks(i,r,'condition',Core.conditions)}${checks(i,r,'response',Core.responses)}<label>支援メモ<textarea placeholder="本人の様子・実施した対処・欠席や遅刻等の連絡内容" oninput="field(${i},'note',this.value)">${esc(r.note)}</textarea></label><label><input id="done-${i}" type="checkbox" ${r.done?'checked':''} onchange="complete(${i},this.checked)"> 内容を確認して記録済みにする</label><p class="muted">工賃概算 <strong id="money-${i}">${Core.money(r).toLocaleString()}円</strong>（確定実績のみ）</p></article>`).join('')}</div>`;}
function markRecord(i){const r=d().rows[i];r.done=false;change();if($('done-'+i))$('done-'+i).checked=false;if($('status-'+i))$('status-'+i).textContent='未記録';if($('money-'+i))$('money-'+i).textContent='0円';}
function field(i,k,v){d().rows[i][k]=v;markRecord(i);}
function toggleItem(i,key,value,on){const set=new Set((d().rows[i][key]||'').split('／').filter(Boolean));on?set.add(value):set.delete(value);field(i,key,Array.from(set).join('／'));}
function timeField(i,k,part,v){const r=d().rows[i];r[k+part]=v;markRecord(i);try{r[k+'Min']=Core.minutes(r[k+'Start'],r[k+'End'],Number(r[k+'Break']||0));$('time-error-'+i+'-'+k).textContent='';$('mins-'+i+'-'+k).textContent=r[k+'Min'];}catch(e){r[k+'Min']=0;$('mins-'+i+'-'+k).textContent='—';$('time-error-'+i+'-'+k).textContent=e.message;}}
function setAttendance(i,v){const r=d().rows[i];if(v==='欠席'&&(r.amMin||r.pmMin||r.meal||r.pickup||r.dropoff)&&!confirm('実績の作業時間・食事・送迎を解除して欠席にしますか？予定と支援メモは残ります。')){render();return;}r.attendance=v;if(v==='欠席'){for(const k of ['am','pm']){r[k+'Actual']='';r[k+'Start']=r[k+'End']='';r[k+'Min']=r[k+'Break']=r[k+'Rate']=0;}r.meal=r.pickup=r.dropoff=false;}markRecord(i);render();}
function actual(i,k,v){const r=d().rows[i];r[k+'Actual']=v;r[k+'Rate']=job(v)?.rate||0;markRecord(i);}
function complete(i,v){d().rows[i].done=v;try{Core.validate(s);change();render()}catch(e){d().rows[i].done=false;toast(e.message);render()}}
function asPlanned(i){const r=d().rows[i];if(!d().published){toast('先に予定を確定してください');return;}if(!r.am||!r.pm){toast('予定の作業が未登録です。実作業を直接選択してください');return;}if((r.amMin||r.pmMin||r.done)&&!confirm('入力済みの作業・時間を予定で置き換えますか？'))return;for(const k of ['am','pm']){r[k+'Actual']=r[k];r[k+'Start']=k==='am'?'10:00':'13:00';r[k+'End']=k==='am'?'12:00':'15:00';r[k+'Break']=0;r[k+'Min']=120;r[k+'Rate']=job(r[k])?.rate||0;}markRecord(i);render();}
function monthly(){return Object.entries(s.days).filter(([dt])=>dt.startsWith(month)).flatMap(([dt,day])=>day.rows.filter(r=>r.done&&Core.attended(r)).map(r=>({...r,date:dt})));}
function summary(){const rows=monthly();return `<div class="eyebrow">MONTHLY SUMMARY</div><h1>実績確認</h1><div class="toolbar"><label>対象月 <input type="month" value="${month}" onchange="month=this.value;render()"></label><button onclick="csv()">確認用CSVをダウンロード</button></div><div class="notice">工賃はデモ単価×実作業時間の概算（利用者・日単位で四捨五入）。生産売上・報酬算定・請求額とは異なります。CSVはLITALICO取込用ではありません。</div><div class="stats"><div class="stat">延べ記録日数<strong>${rows.length}<small> 人日</small></strong></div><div class="stat">実作業時間<strong>${(rows.reduce((a,r)=>a+r.amMin+r.pmMin,0)/60).toFixed(1)}<small> 時間</small></strong></div><div class="stat">工賃概算<strong>${rows.reduce((a,r)=>a+Core.money(r),0).toLocaleString()}<small> 円</small></strong></div></div><div class="card table-wrap"><table><thead><tr><th>利用者</th><th>記録日数</th><th>作業時間</th><th>昼食</th><th>迎え／送り</th><th>工賃概算</th></tr></thead><tbody>${s.users.map(u=>{const rr=rows.filter(r=>r.uid===u.id);return `<tr><td>${esc(u.name)}</td><td>${rr.length}日</td><td>${(rr.reduce((a,r)=>a+r.amMin+r.pmMin,0)/60).toFixed(1)}時間</td><td>${rr.filter(r=>r.meal).length}回</td><td>${rr.filter(r=>r.pickup).length}／${rr.filter(r=>r.dropoff).length}回</td><td>${rr.reduce((a,r)=>a+Core.money(r),0).toLocaleString()}円</td></tr>`}).join('')}</tbody></table></div>`;}
function download(text,filename,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function csv(){let rows=[['日付','利用者ID','氏名','午前作業','午前分','午後作業','午後分','昼食','迎え','送り','工賃概算円','支援メモ','出欠区分','本人の様子','対処','午前開始','午前終了','午前休憩分','午後開始','午後終了','午後休憩分'],...Object.entries(s.days).filter(([dt])=>dt.startsWith(month)).flatMap(([dt,day])=>day.rows.filter(r=>r.done).map(r=>({...r,date:dt}))).map(r=>[r.date,r.uid,user(r.uid).name,name(r.amActual),r.amMin,name(r.pmActual),r.pmMin,Number(r.meal),Number(r.pickup),Number(r.dropoff),Core.money(r),r.note,r.attendance,r.condition,r.response,r.amStart,r.amEnd,r.amBreak,r.pmStart,r.pmEnd,r.pmBreak])];download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),`確認用実績_${month}.csv`,'text/csv;charset=utf-8')}
function planObj(){return s.plans[uid]||(s.plans[uid]={uid,start:date.slice(0,7)+'-01',end:date,interview:'',text:'',staff:false,person:false,status:'未作成',updated:''})}
function planBase(){const p=planObj();return `<div class="eyebrow">SUPPORT PLAN</div><h1>支援計画書作成</h1><p class="muted">日々の記録と面談内容を、原案の材料として一か所にまとめます。</p><div class="toolbar"><select aria-label="対象者" onchange="uid=this.value;render()">${s.users.map(u=>`<option value="${u.id}" ${uid===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select><span class="pill">${esc(p.status)}</span></div><div class="two"><div class="card"><h2>1. 記録を集める</h2><div class="row"><label>開始日 <input type="date" value="${p.start}" oninput="planField('start',this.value)"></label><label>終了日 <input type="date" value="${p.end}" oninput="planField('end',this.value)"></label></div><label>面談の文字起こし・本人の希望<textarea style="margin-top:12px;min-height:180px" oninput="planField('interview',this.value)" placeholder="文字起こしテキストを貼り付け">${esc(p.interview)}</textarea></label><button class="primary" onclick="makeDraft()">記録を引用して原案を作成</button><p class="muted">このデモはAI未接続です。記録にない評価や目標を自動生成せず、確定記録と入力内容を引用します。</p></div><div class="card"><h2>2. 話し合って確認する</h2><p>原案を編集し、職員協議と本人との確認結果を本文に記録してください。</p><div class="checkrow"><label><input type="checkbox" ${p.staff?'checked':''} onchange="review('staff',this.checked)"> 職員協議を実施</label><label><input type="checkbox" ${p.person?'checked':''} onchange="review('person',this.checked)"> 本人と内容を確認</label></div><button class="primary" onclick="finalizePlan()">確認した計画を確定</button><p class="muted">本文・面談・期間を変更した場合、確認チェックを解除します。正式な署名・交付の管理は含みません。</p></div></div><div class="card"><div class="row between"><h2>3. 原案・計画書の編集</h2><button onclick="exportPlan()">テキストで出力</button></div><textarea class="plantext" oninput="planField('text',this.value)">${esc(p.text)}</textarea></div>`;}
function planField(k,v){const p=planObj();p[k]=v;p.staff=p.person=false;p.status='下書き';change()}function review(k,v){planObj()[k]=v;planObj().status='確認中';change()}
function makeDraft(){const p=planObj();if(!p.start||!p.end||p.start>p.end){toast('参照期間を確認してください');return;}if(p.text&&!confirm('編集済みの原案を作り直しますか？'))return;p.text=Core.draft(s,uid,p.start,p.end,p.interview);p.status='下書き';p.staff=p.person=false;change();render()}
async function finalizePlan(){const p=planObj();if(!p.text.trim()||!p.staff||!p.person){toast('本文の作成・職員協議・本人確認を完了してください');return;}p.status='確定';p.updated=new Date().toISOString();change();await save();render()}
function exportPlan(){const p=planObj();if(!p.text){toast('先に原案を作成してください');return;}download(`状態：${p.status}\n職員協議：${p.staff?'確認済み':'未確認'}\n本人確認：${p.person?'確認済み':'未確認'}\n\n${p.text}`,`支援計画_${uid}.txt`,'text/plain;charset=utf-8')}
async function save(){if(busy)return false;try{Core.validate(s);busy=true;$('save').disabled=true;document.querySelector('.layout').inert=true;if(gas){const result=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveState(JSON.parse(JSON.stringify(s))));s.version=result.version;}else{localStorage.setItem(localKey,JSON.stringify(s));}dirty=false;$('save').textContent='変更を保存';toast('保存しました');return true;}catch(e){toast('保存できませんでした：'+e.message);return false;}finally{busy=false;$('save').disabled=false;document.querySelector('.layout').inert=false;}}
async function init(){try{if(gas)s=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getState());else{const stored=localStorage.getItem(localKey);s=stored?JSON.parse(stored):Core.seed();}s=Core.normalize(s);render();}catch(e){$('main').textContent='読み込みできませんでした：'+e.message;}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});window.addEventListener('storage',e=>{if(e.key===localKey&&!dirty){s=Core.normalize(JSON.parse(e.newValue)||Core.seed());render();}});
setInterval(async()=>{if(page==='board'&&!dirty&&gas&&!busy){try{s=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getState());s=Core.normalize(s);render();}catch(e){toast('掲示の更新に失敗しました：'+e.message)}}},30000);init();
const formKeys=[['created','作成日','date'],['certificate','受給者証番号','text'],['periodStart','計画期間（開始）','date'],['periodEnd','計画期間（終了）','date'],['wish','利用者およびその家族の生活に対する希望','area'],['policy','総合的な援助の方針','area'],['long','長期目標','area'],['short','短期目標','area'],['special','特記事項','area'],['cautions','注意事項（必要な場合）','area'],['explained','説明実施日','date'],['manager','サービス管理責任者','text']];
function formData(){let p=planObj();let f;try{f=JSON.parse(p.formJson||'null')}catch(e){}return f||{created:date,certificate:'',periodStart:'',periodEnd:'',wish:user(uid).wish,policy:'',long:'',short:'',special:'',cautions:'',explained:'',manager:'',goals:Array.from({length:4},()=>({goal:'',action:'',support:'',note:''}))};}
function updateForm(k,v,index){const f=formData();if(index===undefined)f[k]=v;else f.goals[index][k]=v;const p=planObj();p.formJson=JSON.stringify(f);p.staff=p.person=false;p.status='下書き';change();const boxes=document.querySelectorAll('#main input[type=checkbox]');boxes.forEach(b=>b.checked=false);}
function plan(){return planBase()+`<div class="card"><div class="row between"><h2>4. 個別支援計画書（A4縦）</h2><button class="primary" onclick="printPlan()">A4縦で印刷／PDF保存</button></div><p class="muted">見本の項目に沿って入力してください。上の引用原案を材料に、帳票の各欄を整理します。原案の自由文はこの帳票に自動転記されません。</p><div class="two">${formKeys.map(([k,label,type])=>{const f=formData();return `<label>${label}${type==='area'?`<textarea oninput="updateForm('${k}',this.value)">${esc(f[k])}</textarea>`:`<input style="display:block;width:100%" type="${type}" value="${esc(f[k])}" oninput="updateForm('${k}',this.value)">`}</label>`}).join('')}</div><h2 style="margin-top:24px">生活の質や就労に必要なスキルを向上させるための目標</h2>${formData().goals.map((g,i)=>`<div class="card" style="background:#f6f8f5"><h2>優先順位 ${i+1}</h2><div class="two">${[['goal','解決すべき課題・具体的な到達目標'],['action','課題解決のための本人の取り組み'],['support','支援者の取り組み'],['note','留意事項']].map(([k,label])=>`<label>${label}<textarea oninput="updateForm('${k}',this.value,${i})">${esc(g[k])}</textarea></label>`).join('')}</div></div>`).join('')}<p class="muted">印刷画面はA4・縦・倍率100%・ヘッダーとフッターなしを選択してください。内容が長い場合は複数ページになります。印刷は保存とは別操作です。</p></div>`;}
function jpDate(v){if(!v)return '　　　年　　月　　日';const a=v.split('-');return `${Number(a[0])}年${Number(a[1])}月${Number(a[2])}日`;}
function printMarkup(f,u,status){const row=(label,value)=>`<tr><th>${label}</th><td>${esc(value)||'　'}</td></tr>`;return `<div class="print-title"><h1>個別支援計画書${status==='確定'?'':'（案）'}</h1><div>作成日：${jpDate(f.created)}</div></div><table class="print-meta"><colgroup><col style="width:27%"><col></colgroup>${row('利用者氏名',u.name+' 様')}${row('受給者証番号',f.certificate)}${row('計画期間',jpDate(f.periodStart)+' ～ '+jpDate(f.periodEnd))}${row('利用者およびその家族の<br>生活に対する希望',f.wish)}${row('総合的な援助の方針',f.policy)}${row('長期目標',f.long)}${row('短期目標',f.short)}</table><h2>生活の質や就労に必要なスキルを向上させるための目標</h2><table class="print-goals"><colgroup><col style="width:7%"><col style="width:25%"><col style="width:23%"><col style="width:28%"><col style="width:17%"></colgroup><thead><tr><th>優先<br>順位</th><th>解決すべき課題・<br>具体的な到達目標</th><th>課題解決のための<br>本人の取り組み</th><th>支援者の取り組み</th><th>留意事項</th></tr></thead><tbody>${f.goals.map((g,i)=>`<tr><td style="text-align:center">${i+1}</td><td>${esc(g.goal)||'　'}</td><td>${esc(g.action)||'　'}</td><td>${esc(g.support)||'　'}</td><td>${esc(g.note)||'　'}</td></tr>`).join('')}</tbody></table>${f.cautions?`<div class="print-caution">注意事項<br>${esc(f.cautions)}</div>`:''}<table class="print-meta" style="margin-top:4mm"><colgroup><col style="width:27%"><col></colgroup>${row('特記事項',f.special)}</table><div class="print-sign"><p>説明実施日：${jpDate(f.explained)}</p><p>個別支援計画の内容について説明を受け、同意し交付（受領）しました。</p><table><tr><th>利用者氏名</th><td>　　　　　　　　　　　印</td></tr><tr><th>サービス管理責任者</th><td>${esc(f.manager)}　　　　　　　　　印</td></tr></table></div>`;}
function printPlan(){const f=formData();if(f.periodStart&&f.periodEnd&&f.periodStart>f.periodEnd){toast('計画期間の開始日と終了日を確認してください');return;}let el=$('printPlan');if(!el){el=document.createElement('section');el.id='printPlan';document.body.appendChild(el);}el.innerHTML=printMarkup(f,user(uid),planObj().status);document.title='個別支援計画書_'+user(uid).name;window.print();}

</script></body></html>
